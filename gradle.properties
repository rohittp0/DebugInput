# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8

# The single source of the version for every published artifact. CI resolves the
# next public version by probing R2 and may override this with -PVERSION_NAME.
VERSION_NAME=0.1.0-SNAPSHOT

# Configuration cache is on for ordinary builds. Publish tasks opt out explicitly;
# see the root build script.
org.gradle.configuration-cache=true
org.gradle.caching=true

kotlin.code.style=official
android.useAndroidX=true
